server {
    listen 80;
    listen [::]:80;
    server_name demo.msbeton.sk;

    root /var/www/msbeton/artifacts/web/dist/public;
    index index.html;

    # MIME types – vrátane video (opravuje nehranie videa v prehliadači)
    include /etc/nginx/mime.types;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statické súbory (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pre statické assety
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
