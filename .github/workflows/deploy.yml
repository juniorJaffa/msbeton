name: Deploy na Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/msbeton
            git fetch origin main
            git reset --hard origin/main
            git lfs pull
            pnpm install --frozen-lockfile
            pnpm --filter @workspace/api-server run build
            PORT=3001 BASE_PATH=/ pnpm --filter @workspace/web run build
            mkdir -p artifacts/web/dist/public/videos
            cp artifacts/web/public/videos/hero-video.mp4 artifacts/web/dist/public/videos/hero-video.mp4
            set -a && source artifacts/api-server/.env && set +a
            pnpm --filter @workspace/db run push
            export $(cat artifacts/api-server/.env | xargs)
            pm2 restart msbeton-api --update-env

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://demo.msbeton.sk)
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED — HTTP $STATUS"
            exit 1
          fi
          echo "Health check OK — HTTP $STATUS"
