name: Deploy na Hetzner (ms-beton)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/msbeton
            git fetch origin main
            git reset --hard origin/main
            git lfs pull
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm --filter @workspace/api-server run build
            PORT=3001 BASE_PATH=/ pnpm --filter @workspace/web run build
            # Nginx servuje /images/ a /videos/ priamo z public/ — dist kópie nepotrebné
            rm -rf artifacts/web/dist/public/images artifacts/web/dist/public/videos
            # Permissions pre nginx alias (git reset --hard ich resetuje na 700/600)
            chmod -R o+rX artifacts/web/public/images/ 2>/dev/null || true
            chmod -R o+rX artifacts/web/public/videos/ 2>/dev/null || true
            DATABASE_URL=$(node -e "const c=require('./ecosystem.config.cjs');console.log(c.apps[0].env.DATABASE_URL)") \
              pnpm --filter @workspace/db run push
            pm2 delete msbeton-api || true
            pm2 start ecosystem.config.cjs
            pm2 save

      - name: Health check
        run: |
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://msbeton.sk)
          if [ "$STATUS" != "200" ]; then
            echo "Web health check FAILED — HTTP $STATUS"
            exit 1
          fi
          echo "Web OK — HTTP $STATUS"
          API=$(curl -s https://msbeton.sk/api/healthz | grep -c '"ok"' || true)
          if [ "$API" = "0" ]; then
            echo "API health check FAILED"
            exit 1
          fi
          echo "API OK"
