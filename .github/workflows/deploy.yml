name: Deploy na Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /var/www/msbeton
            ./deploy.sh

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://demo.msbeton.sk)
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED — HTTP $STATUS"
            exit 1
          fi
          echo "Health check OK — HTTP $STATUS"
