name: Deploy na Hetzner (ms-beton)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_MS_BETON_HOST }}
          username: ${{ secrets.HETZNER_MS_BETON_USER }}
          key: ${{ secrets.HETZNER_MS_BETON_SSH_KEY }}
          script: |
            set -e
            cd /var/www/msbeton
            git fetch origin main
            git reset --hard origin/main
            git lfs pull
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm --filter @workspace/api-server run build
            PORT=3001 BASE_PATH=/ pnpm --filter @workspace/web run build
            mkdir -p artifacts/web/dist/public/videos
            cp artifacts/web/public/videos/hero-video.mp4 artifacts/web/dist/public/videos/hero-video.mp4
            DATABASE_URL=$(node -e "const c=require('./ecosystem.config.cjs');console.log(c.apps[0].env.DATABASE_URL)") \
              pnpm --filter @workspace/db run push
            pm2 delete msbeton-api || true
            pm2 start ecosystem.config.cjs
            pm2 save

      - name: Health check
        run: |
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://demo.msbeton.sk)
          if [ "$STATUS" != "200" ]; then
            echo "Web health check FAILED — HTTP $STATUS"
            exit 1
          fi
          echo "Web OK — HTTP $STATUS"
          API=$(curl -s https://demo.msbeton.sk/api/healthz | grep -c '"ok"' || true)
          if [ "$API" = "0" ]; then
            echo "API health check FAILED"
            exit 1
          fi
          echo "API OK"
