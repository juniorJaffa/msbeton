<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS-BETON – Chvíľočku…</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes drip  { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(6px) scaleY(1.15); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  html, body {
    min-height: 100vh;
    background: #001D3D;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  /* Subtle concrete texture via CSS */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.015) 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.01) 1px, transparent 1px),
      radial-gradient(circle at 50% 80%, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 40px 40px, 60px 60px, 35px 35px;
    pointer-events: none;
  }
  .mixer-wrap {
    animation: float 3s ease-in-out infinite;
    margin-bottom: 32px;
  }
  .drum {
    animation: spin 2.4s linear infinite;
    transform-origin: 50% 50%;
  }
  .drip-drop {
    animation: drip 1.8s ease-in-out infinite;
    transform-origin: 50% 0;
  }
  .logo {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.25em;
    color: #EDC531;
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: pulse 3s ease-in-out infinite;
  }
  h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 900;
    color: #EDC531;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  p {
    font-size: clamp(13px, 3vw, 16px);
    color: rgba(255,255,255,0.6);
    max-width: 380px;
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .code {
    display: inline-block;
    background: rgba(237,197,49,0.12);
    border: 1px solid rgba(237,197,49,0.25);
    color: #EDC531;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 28px;
  }
  .reload {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #EDC531;
    color: #001D3D;
    font-weight: 900;
    font-size: 14px;
    padding: 12px 28px;
    border-radius: 6px;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s;
    margin-top: 8px;
  }
  .reload:hover { opacity: 0.88; }
  .footer {
    position: fixed;
    bottom: 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="mixer-wrap">
  <!-- Cute concrete mixer SVG -->
  <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Betónomiešač">
    <!-- Body / chassis -->
    <rect x="18" y="72" width="84" height="28" rx="6" fill="#0a2d52"/>
    <rect x="18" y="72" width="84" height="28" rx="6" stroke="#EDC531" stroke-width="1.5" stroke-opacity="0.3"/>
    <!-- Wheels -->
    <circle cx="36" cy="102" r="10" fill="#0a2d52" stroke="#EDC531" stroke-width="2"/>
    <circle cx="36" cy="102" r="4" fill="#EDC531" opacity="0.7"/>
    <circle cx="84" cy="102" r="10" fill="#0a2d52" stroke="#EDC531" stroke-width="2"/>
    <circle cx="84" cy="102" r="4" fill="#EDC531" opacity="0.7"/>
    <!-- Drum support -->
    <line x1="60" y1="72" x2="60" y2="55" stroke="#EDC531" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="72" x2="52" y2="55" stroke="#EDC531" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <!-- Rotating drum -->
    <g class="drum">
      <ellipse cx="60" cy="44" rx="22" ry="22" fill="#0f3860" stroke="#EDC531" stroke-width="2"/>
      <!-- Mixing blades -->
      <line x1="60" y1="26" x2="60" y2="62" stroke="#EDC531" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="42" y1="35" x2="78" y2="53" stroke="#EDC531" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="78" y1="35" x2="42" y2="53" stroke="#EDC531" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <circle cx="60" cy="44" r="5" fill="#EDC531"/>
    </g>
    <!-- Concrete drip -->
    <g class="drip-drop">
      <ellipse cx="60" cy="70" rx="5" ry="3" fill="#EDC531" opacity="0.5"/>
      <path d="M57 70 Q60 80 60 84 Q60 80 63 70Z" fill="#EDC531" opacity="0.35"/>
    </g>
  </svg>
</div>

<div class="logo">MS-BETON</div>

<h1>Betón sa miesi&hellip;<br>chvíľočku!</h1>

<p>Server si dal krátku prestávku —<br>presne ako mixér po dlhej smene.</p>
<p>Vrátim sa skôr ako betón stuhne.</p>

<div style="margin: 16px 0"><span class="code">500 / 502 / 503</span></div>

<button class="reload" onclick="location.reload()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
  </svg>
  Skúsiť znova
</button>

<div class="footer">demo.msbeton.sk &nbsp;·&nbsp; MS-BETON, spol. s r.o.</div>
</body>
</html>
