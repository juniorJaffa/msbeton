<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS-BETON – Chvíľočku…</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes wspin  { to { transform: rotate(-360deg); } }
  /* Kvapka tečie a mizne */
  @keyframes drip {
    0%   { opacity: 0; transform: translateY(0) scaleY(0.6); }
    15%  { opacity: 0.7; transform: translateY(2px) scaleY(1); }
    70%  { opacity: 0.4; transform: translateY(12px) scaleY(1.4); }
    100% { opacity: 0; transform: translateY(20px) scaleY(0.5); }
  }

  html, body {
    min-height: 100vh;
    background: #001D3D;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.015) 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.010) 1px, transparent 1px),
      radial-gradient(circle at 50% 80%, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 40px 40px, 60px 60px, 35px 35px;
    pointer-events: none;
  }

  .mixer-wrap { animation: float 3s ease-in-out infinite; margin-bottom: 32px; }

  /* Lopatky rotujú – transform-origin = stred bubna (112, 50) */
  .drum-fins { animation: spin 2.2s linear infinite; transform-origin: 112px 50px; }

  /* Kolesá: predné sa točia v smere, zadné opačne (vizuálny trik) */
  .wf  { animation: spin  1.5s linear infinite; transform-origin:  26px 100px; }
  .wr1 { animation: wspin 1.5s linear infinite; transform-origin: 118px 100px; }
  .wr2 { animation: spin  1.5s linear infinite; transform-origin: 142px 100px; }

  .drip-drop { animation: drip 2.2s ease-in-out infinite; transform-origin: 164px 87px; }

  .logo {
    font-size: 13px; font-weight: 900; letter-spacing: 0.25em;
    color: #EDC531; text-transform: uppercase; margin-bottom: 20px;
    animation: pulse 3s ease-in-out infinite;
  }
  h1  { font-size: clamp(22px,5vw,32px); font-weight: 900; color: #EDC531; margin-bottom: 12px; line-height: 1.2; }
  p   { font-size: clamp(13px,3vw,16px); color: rgba(255,255,255,0.6); max-width: 380px; line-height: 1.6; margin-bottom: 8px; }
  .code {
    display: inline-block;
    background: rgba(237,197,49,0.12); border: 1px solid rgba(237,197,49,0.25);
    color: #EDC531; font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    padding: 3px 10px; border-radius: 4px; margin-bottom: 28px;
  }
  .reload {
    display: inline-flex; align-items: center; gap: 8px;
    background: #EDC531; color: #001D3D; font-weight: 900; font-size: 14px;
    padding: 12px 28px; border-radius: 6px; text-decoration: none;
    cursor: pointer; border: none; transition: opacity 0.15s; margin-top: 8px;
  }
  .reload:hover { opacity: 0.88; }
  .footer { position: fixed; bottom: 16px; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 0.05em; }
</style>
</head>
<body>

<div class="mixer-wrap">
  <svg width="188" height="118" viewBox="0 0 188 118" fill="none"
       xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Betónomiešač">
    <defs>
      <!--
        Clip-path MUSÍ byť na statickom RODIČOVSKOM <g>, NIE na rotujúcom.
        Inak sa clip-path otočí spolu s lopatkami a tie vypadnú von.
        Architekúra: <g clip-path> [statický] → <g.drum-fins> [rotuje vnútri]
      -->
      <clipPath id="dc">
        <ellipse cx="112" cy="50" rx="50" ry="21"/>
      </clipPath>

      <!-- Radiálny gradient pre hĺbku bubna -->
      <radialGradient id="drumGrad" cx="40%" cy="40%" r="60%">
        <stop offset="0%"   stop-color="#1a4a78"/>
        <stop offset="100%" stop-color="#071d3a"/>
      </radialGradient>
    </defs>

    <!-- ══ PODVOZOK ══ -->
    <rect x="8" y="79" width="170" height="16" rx="3"
          fill="#0a2d52" stroke="#EDC531" stroke-width="1.3" stroke-opacity="0.32"/>

    <!-- ══ KABÍNA ══ -->
    <path d="M10 79 L10 50 Q12 36 28 34 L55 34 L58 51 L58 79Z"
          fill="#0f3860" stroke="#EDC531" stroke-width="1.5"/>
    <!-- Čelné sklo -->
    <path d="M17 77 L17 54 Q18 46 28 44 L47 44 L49 54 L49 77Z"
          fill="#001d3d" fill-opacity="0.6" stroke="#EDC531" stroke-width="0.8" stroke-opacity="0.4"/>
    <!-- Predné svetlo -->
    <rect x="8" y="68" width="5" height="5" rx="1.5" fill="#EDC531" opacity="0.8"/>
    <!-- Dvere -->
    <line x1="38" y1="51" x2="38" y2="79" stroke="#EDC531" stroke-width="0.7" stroke-opacity="0.25"/>
    <!-- Výfuk na streche -->
    <rect x="44" y="27" width="4" height="11" rx="2" fill="#0a2d52" stroke="#EDC531" stroke-width="1" stroke-opacity="0.45"/>
    <ellipse cx="46" cy="27" rx="3" ry="1.5" fill="#EDC531" opacity="0.28"/>

    <!-- ══ NOSNÉ RAMENÁ BUBNA ══ -->
    <line x1="58" y1="79" x2="72" y2="57" stroke="#EDC531" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="76" y1="79" x2="86" y2="66" stroke="#EDC531" stroke-width="2"   stroke-linecap="round" opacity="0.38"/>
    <line x1="136" y1="79" x2="144" y2="71" stroke="#EDC531" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- ══ BUBON ══ -->

    <!-- Vrstva 1: Pozadie bubna s gradientom (statické) -->
    <ellipse cx="112" cy="50" rx="54" ry="25" fill="url(#drumGrad)"/>

    <!--
      Vrstva 2: Rotujúce lopatky – KĽÚČOVÁ ARCHITEKTÚRA:
      clip-path je na VONKAJŠOM statickém <g>, nie na rotujúcom!
      Rotujúci <g.drum-fins> je vnútri → clip ostane pevný.
    -->
    <g clip-path="url(#dc)">
      <g class="drum-fins">
        <!--
          6 rovnobežných diagonálnych línií (špiráľové lopatky).
          Keď rotujú, vyzerajú ako helicálne lopatky vo valci.
          Rozsah väčší ako elipsa → clip-path (vonkajší) ich orežie.
        -->
        <line x1="54"  y1="78" x2="102" y2="22" stroke="#EDC531" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
        <line x1="72"  y1="78" x2="120" y2="22" stroke="#EDC531" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
        <line x1="90"  y1="78" x2="138" y2="22" stroke="#EDC531" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
        <line x1="108" y1="78" x2="156" y2="22" stroke="#EDC531" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
        <line x1="126" y1="78" x2="174" y2="22" stroke="#EDC531" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
        <line x1="36"  y1="78" x2="84"  y2="22" stroke="#EDC531" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
        <!-- Stredový náboj -->
        <circle cx="112" cy="50" r="9" fill="#071d3a"/>
        <circle cx="112" cy="50" r="5" fill="#EDC531" opacity="0.95"/>
      </g>
    </g>

    <!-- Vrstva 3: Obrys bubna navrchu (kreslí sa cez lopatky → čistý okraj) -->
    <ellipse cx="112" cy="50" rx="54" ry="25"
             fill="none" stroke="#EDC531" stroke-width="2.2"/>

    <!-- Predný (vstupný) lievik bubna – jemný -->
    <ellipse cx="60" cy="52" rx="4" ry="22"
             fill="#071d3a" fill-opacity="0.7" stroke="#EDC531" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Zadné čelo bubna – ukazuje 3D hĺbku valca -->
    <ellipse cx="164" cy="50" rx="5.5" ry="23"
             fill="#071d3a" stroke="#EDC531" stroke-width="1.8"/>

    <!-- ══ ŽĽAB (discharge chute) ══ -->
    <path d="M160 67 L172 82 L164 86 L152 71Z"
          fill="#EDC531" opacity="0.4"/>
    <!-- Zvýraznenie žľabu – vnútorná línia -->
    <line x1="160" y1="67" x2="164" y2="86"
          stroke="#EDC531" stroke-width="0.8" stroke-opacity="0.6"/>

    <!-- ══ KVAPKA BETÓNU ZO ŽĽABU ══ -->
    <!--
      Kvapka padá dole zo žľabu (164, 87) a mizne.
      Animácia: objaví sa → padá → mizne (nie skáče hore-dole).
    -->
    <g class="drip-drop">
      <path d="M162 87 Q160 93 162 99 Q162 105 164 104 Q166 105 166 99 Q168 93 166 87 Q164 84 162 87Z"
            fill="#EDC531" opacity="0.55"/>
    </g>

    <!-- ══ KOLESÁ ══ -->
    <!-- Predné koleso -->
    <g class="wf">
      <circle cx="26" cy="100" r="12" fill="#0a2d52" stroke="#EDC531" stroke-width="2"/>
      <!-- 4 špice -->
      <line x1="26" y1="88"  x2="26" y2="112" stroke="#EDC531" stroke-width="1.3" opacity="0.45"/>
      <line x1="14" y1="100" x2="38" y2="100" stroke="#EDC531" stroke-width="1.3" opacity="0.45"/>
      <line x1="17.5" y1="91.5" x2="34.5" y2="108.5" stroke="#EDC531" stroke-width="1" opacity="0.3"/>
      <line x1="34.5" y1="91.5" x2="17.5" y2="108.5" stroke="#EDC531" stroke-width="1" opacity="0.3"/>
      <circle cx="26" cy="100" r="4.5" fill="#EDC531" opacity="0.85"/>
    </g>

    <!-- Zadné koleso 1 -->
    <g class="wr1">
      <circle cx="118" cy="100" r="12" fill="#0a2d52" stroke="#EDC531" stroke-width="2"/>
      <line x1="118" y1="88"  x2="118" y2="112" stroke="#EDC531" stroke-width="1.3" opacity="0.45"/>
      <line x1="106" y1="100" x2="130" y2="100" stroke="#EDC531" stroke-width="1.3" opacity="0.45"/>
      <line x1="109.5" y1="91.5" x2="126.5" y2="108.5" stroke="#EDC531" stroke-width="1" opacity="0.3"/>
      <line x1="126.5" y1="91.5" x2="109.5" y2="108.5" stroke="#EDC531" stroke-width="1" opacity="0.3"/>
      <circle cx="118" cy="100" r="4.5" fill="#EDC531" opacity="0.85"/>
    </g>

    <!-- Zadné koleso 2 (dvojmontáž) -->
    <g class="wr2">
      <circle cx="142" cy="100" r="12" fill="#0a2d52" stroke="#EDC531" stroke-width="2"/>
      <line x1="142" y1="88"  x2="142" y2="112" stroke="#EDC531" stroke-width="1.3" opacity="0.45"/>
      <line x1="130" y1="100" x2="154" y2="100" stroke="#EDC531" stroke-width="1.3" opacity="0.45"/>
      <line x1="133.5" y1="91.5" x2="150.5" y2="108.5" stroke="#EDC531" stroke-width="1" opacity="0.3"/>
      <line x1="150.5" y1="91.5" x2="133.5" y2="108.5" stroke="#EDC531" stroke-width="1" opacity="0.3"/>
      <circle cx="142" cy="100" r="4.5" fill="#EDC531" opacity="0.85"/>
    </g>
  </svg>
</div>

<div class="logo">MS-BETON</div>
<h1>Betón sa mieša&hellip;<br>chvíľočku!</h1>
<p>Server si dal krátku prestávku —<br>presne ako mixér po dlhej smene.</p>
<p>Vrátim sa skôr ako betón stuhne.</p>
<div style="margin: 16px 0"><span class="code">500 / 502 / 503</span></div>
<button class="reload" onclick="location.reload()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
  </svg>
  Skúsiť znova
</button>
<div class="footer">msbeton.sk &nbsp;·&nbsp; MS-BETON, spol. s r.o.</div>
</body>
</html>
