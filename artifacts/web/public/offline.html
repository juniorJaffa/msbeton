<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MS-BETON — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', -apple-system, sans-serif;
      background: linear-gradient(135deg, #001D3D 0%, #00305f 60%, #001D3D 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; margin-bottom: 32px; }
    .logo span:first-child { color: #EDC531; }
    .logo span:last-child { color: #fff; }
    h1 { color: #fff; font-size: 20px; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    p { color: rgba(255,255,255,0.5); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
    a {
      display: inline-block;
      background: #EDC531;
      color: #001D3D;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 14px 28px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    a:hover { opacity: 0.85; }
    .contact { margin-top: 28px; color: rgba(255,255,255,0.3); font-size: 13px; }
    .contact a { background: none; color: #EDC531; padding: 0; letter-spacing: 0; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>MS</span><span>-BETON</span></div>
    <h1>Ste offline</h1>
    <p>Nemáte pripojenie na internet. Skúste znova alebo nás kontaktujte priamo.</p>
    <a href="/">Skúsiť znova</a>
    <div class="contact">
      Telefón: <a href="tel:+421944069305">0944 069 305</a>
    </div>
  </div>
</body>
</html>
