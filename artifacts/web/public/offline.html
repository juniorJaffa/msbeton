<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MS-BETON — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes float  { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-10px)} }
    @keyframes spin   { to{transform:rotate(360deg)} }
    @keyframes wspin  { to{transform:rotate(-360deg)} }
    @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes glow   { 0%,100%{opacity:.5;transform:translateX(-50%) scale(1)} 50%{opacity:.9;transform:translateX(-50%) scale(1.15)} }
    @keyframes rise   { 0%{opacity:0;transform:translateY(0) scale(.8)} 30%{opacity:.6} 100%{opacity:0;transform:translateY(-100px) scale(.2)} }
    @keyframes scanA  { 0%,15%,100%{opacity:.18} 20%,85%{opacity:1} }
    @keyframes scanB  { 0%,30%,100%{opacity:.18} 35%,85%{opacity:1} }
    @keyframes scanC  { 0%,45%,100%{opacity:.18} 50%,85%{opacity:1} }
    @keyframes scanD  { 0%,60%,100%{opacity:.18} 65%,85%{opacity:1} }
    @keyframes ripple { 0%{transform:translate(-50%,-50%) scale(.6);opacity:.5} 100%{transform:translate(-50%,-50%) scale(2.4);opacity:0} }

    html, body {
      min-height: 100vh;
      background: linear-gradient(160deg, #001D3D 0%, #002d5a 55%, #001D3D 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.015) 1px, transparent 1px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,.010) 1px, transparent 1px),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,.012) 1px, transparent 1px);
      background-size: 40px 40px, 60px 60px, 35px 35px;
      pointer-events: none;
    }

    /* Stúpajúce častice */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: rgba(237,197,49,.15);
      animation: rise linear infinite;
      pointer-events: none;
    }

    .wrap { position: relative; max-width: 380px; width: 100%; }

    /* Ripple rings za mixérom */
    .ring {
      position: absolute;
      top: 46%;
      left: 50%;
      width: 130px; height: 60px;
      border: 1.5px solid rgba(237,197,49,.25);
      border-radius: 50%;
      animation: ripple 3s ease-out infinite;
      pointer-events: none;
    }
    .ring:nth-child(2) { animation-delay: 1s; }
    .ring:nth-child(3) { animation-delay: 2s; }

    /* Svietiaci odlesk pod mixérom */
    .glow {
      position: absolute;
      bottom: 148px;
      left: 50%;
      width: 160px; height: 30px;
      background: radial-gradient(ellipse, rgba(237,197,49,.18) 0%, transparent 70%);
      filter: blur(8px);
      animation: glow 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    /* WiFi signal icon */
    .signal {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 40px;
      margin-bottom: 10px;
      position: relative;
    }
    .signal-bar {
      width: 9px;
      border-radius: 2px 2px 0 0;
      background: #EDC531;
    }
    .signal-bar:nth-child(1) { height: 10px; animation: scanA 2.4s ease-in-out infinite; }
    .signal-bar:nth-child(2) { height: 19px; animation: scanB 2.4s ease-in-out infinite; }
    .signal-bar:nth-child(3) { height: 28px; animation: scanC 2.4s ease-in-out infinite; }
    .signal-bar:nth-child(4) { height: 37px; animation: scanD 2.4s ease-in-out infinite; }
    .signal-x {
      position: absolute;
      right: 82px; top: 0;
      width: 16px; height: 16px;
    }
    .signal-x::before, .signal-x::after {
      content: "";
      position: absolute;
      top: 50%; left: 0;
      width: 100%; height: 2px;
      background: #ff6b6b;
      border-radius: 2px;
    }
    .signal-x::before { transform: translateY(-50%) rotate(45deg); }
    .signal-x::after  { transform: translateY(-50%) rotate(-45deg); }

    /* Mixer */
    .mixer-wrap {
      animation: float 3.4s ease-in-out infinite;
      position: relative; z-index: 2;
      margin-bottom: 8px;
    }
    .drum-fins { animation: spin 2.2s linear infinite; transform-origin: 112px 50px; }
    .wheel-f   { animation: spin 1.9s linear infinite; transform-origin: 50px 88px; }
    .wheel-r   { animation: wspin 1.9s linear infinite; transform-origin: 148px 88px; }

    /* Texty */
    .logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; margin-bottom: 20px; }
    .logo .ms   { color: #EDC531; }
    .logo .dash { color: rgba(237,197,49,.35); }
    .logo .beton{ color: #fff; }

    h1 {
      font-size: 18px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .fun {
      color: #EDC531;
      font-size: 14px; font-weight: 700;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }
    .sub {
      color: rgba(255,255,255,.45);
      font-size: 13px; line-height: 1.65;
      margin-bottom: 30px;
    }

    /* Tlačidlo */
    .btn {
      display: inline-block;
      background: #EDC531;
      color: #001D3D;
      font-weight: 800; font-size: 12px;
      text-transform: uppercase; letter-spacing: 2px;
      padding: 14px 36px;
      text-decoration: none;
      border-radius: 2px;
      transition: transform .12s, opacity .12s;
      animation: pulse 2.4s ease-in-out infinite;
    }
    .btn:hover  { opacity: .88; animation: none; }
    .btn:active { transform: scale(.97); }

    /* Kontakty */
    .contacts {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .contact-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .contact-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .contact-icon svg { width: 13px; height: 13px; color: #EDC531; }
    .contacts a {
      color: rgba(255,255,255,.45);
      text-decoration: none;
      font-size: 13px; font-weight: 600;
      transition: color .15s;
    }
    .contacts a:hover { color: #EDC531; }

    /* Divider */
    .divider {
      width: 40px; height: 1px;
      background: rgba(255,255,255,.1);
      margin: 20px auto 0;
    }
  </style>
</head>
<body>

  <!-- Stúpajúce zlaté častice -->
  <div class="particle" style="left:8%;bottom:-8px;width:5px;height:5px;animation-duration:7s;animation-delay:0s"></div>
  <div class="particle" style="left:22%;bottom:-8px;width:3px;height:3px;animation-duration:5.5s;animation-delay:1.3s"></div>

  <div class="particle" style="left:78%;bottom:-8px;width:5px;height:5px;animation-duration:8s;animation-delay:.6s"></div>
  <div class="particle" style="left:42%;bottom:-8px;width:7px;height:7px;animation-duration:7.5s;animation-delay:3.5s;opacity:.08"></div>
  <div class="particle" style="right:12%;bottom:-8px;width:3px;height:3px;animation-duration:6s;animation-delay:4.2s"></div>
  <div class="particle" style="left:65%;bottom:-8px;width:4px;height:4px;animation-duration:9s;animation-delay:1.8s"></div>

    <!-- Ripple rings -->

  </div>
</body>
